replicaCount: 1

image:
  repository: rg.nl-ams.scw.cloud/sendent-public/sendent-msteams
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # REQUIRED: Public URL where this add-in will be accessible (e.g. https://teams.example.com)
  BASE_URL: "https://teams.yourdomain.com"
  # Azure App type: MultiTenant, SingleTenant, or UserAssignedMSI. Leave empty for MultiTenant.
  MSAPP_TYPE: ""
  # REQUIRED: Azure App (client) ID used for bot auth and the on-behalf-of token exchange
  MSAPP_ID: "your-app-id"
  # Azure Tenant ID — required when MSAPP_TYPE is SingleTenant, otherwise ignored
  MSAPP_TENANT_ID: "your-tenant-id"
  # Default Nextcloud server URL returned to the add-in
  DEFAULT_NEXTCLOUD_URL: "https://nextcloud.yourdomain.com"
  # Fallback target for the /proxy/* request proxy. Normally overridden per-request
  # via the `sendent-apiurl` header; this value is only used when that header is missing.
  PROXY_PLACEHOLDER_URL: "https://placeholder.sendent.dev"

secret:
  # Reference an externally-managed Secret (created by kubectl, Sealed Secrets,
  # External Secrets Operator, etc.) instead of having the chart create one.
  # When set, `MSAPP_PASSWORD` below is ignored and no Secret is rendered.
  existingSecret: ""
  # Key within the existing Secret holding the Azure App client secret.
  existingSecretKey: "MSAPP_PASSWORD"
  # Azure App client secret. Only used when `existingSecret` is empty.
  # Leave blank to force callers to provide it via --set or a values file.
  MSAPP_PASSWORD: ""

service:
  type: ClusterIP
  port: 4200

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: teams.yourdomain.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: msteams-addin-tls
  #    hosts:
  #      - teams.yourdomain.com

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}